server {
    listen 443 ssl;
    server_name localhost.classified-connector.dev;

    ssl_certificate     /etc/ssl/classified-connector/localhost.classified-connector.dev.crt;
    ssl_certificate_key /etc/ssl/classified-connector/localhost.classified-connector.dev.key;

    root /mnt/d/Repos/classified-connector/public;

    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock; # Adjust PHP version if needed
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
    }

    error_log /mnt/d/Repos/classified-connector.error.log;
    access_log /mnt/d/Repos/classified-connector.access.log;
}

server {
    listen 80;
    server_name localhost.classified-connector.dev;

    return 301 https://$host$request_uri;
}
